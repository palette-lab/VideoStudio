[project]
name = "palette-plugin-palette-video"
version = "1.0.0"
description = "Palette-Video: understands a video request and routes it to the right studio apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "sqlalchemy>=2.0.47",
    "alembic>=1.17.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "fal-client>=0.5.0",
    # `pltt test` ships the backend SDK (palette_sdk) on PYTHONPATH.
]
